spring.application.name=interview-assistant

spring.datasource.url=jdbc:postgresql://localhost:5432/interview_assistant
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway owns the schema; Hibernate only validates entities against it, never generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

groq.base-url=https://api.groq.com/openai/v1
groq.api-key=${GROQ_API_KEY:not-set}
groq.model-name=${GROQ_MODEL_NAME:openai/gpt-oss-120b}

exa.api-key=${EXA_API_KEY:not-set}
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s

# How many enrichment jobs run at once. On Groq's 8k tokens-per-minute tier, concurrent searches
# mostly take turns on the same budget, so 1 finishes each topic fastest. Raise with a paid tier.
enrichment.max-concurrent-jobs=1
