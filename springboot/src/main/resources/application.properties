spring.application.name=interview-assistant

spring.datasource.url=jdbc:postgresql://localhost:5432/interview_assistant
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway owns the schema; Hibernate only validates entities against it, never generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

langchain4j.anthropic.chat-model.api-key=${ANTHROPIC_API_KEY:not-set}
